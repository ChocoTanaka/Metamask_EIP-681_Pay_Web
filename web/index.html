<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="This is a EIP-681 pay system for PC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="erc681pay_dx">
  <link rel="apple-touch-icon" href="icons/JPYCPay_192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="JPYCPay_fav.png"/>

  <title>erc681pay_dx</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    async function connectMetaMask() {
      if (window.ethereum) {
        try {
          // 接続要求
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          return accounts[0]; // アドレスを返す
        } catch (error) {
          console.error("User rejected", error);
          return null;
        }
      } else {
        alert("MetaMask is not installed!");
        return null;
      }
    }
  </script>
  <script>
    async sendTransactionJS(tx) {
      if (typeof window.ethereum === 'undefined') return null;
      try {
    // Reownのrequestとほぼ同じ構造で叩けます
        const txHash = await window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [tx], // txはDart側で作ったMapがそのままJSオブジェクトとして渡ります
        });
        return txHash;
      } catch (error) {
        console.error("Transaction Error:", error);
        return null;
      }
    }
  </script>
</body>
</html>
