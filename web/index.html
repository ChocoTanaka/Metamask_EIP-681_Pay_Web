<head>

  <meta charset="UTF-8">
  <meta content="width=1000, height=700, initial-scale=1.0" name="viewport">
  <meta name="description" content="This is a JPYC Sub-Payment system for PC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MM_SubPay_dx">

  <!-- Favicon -->

  <title>erc681pay_dx</title>

<body>
<script type="module" src="./js/reown-appkit4.js"></script>
<script>
  let appKitInstance = null;
  let wagmiAdapterInstance = null;
  let currentDartCallback = null; // Dart側のコールバックを保持

  // ① 初期化関数（Dartの各種チェックを挟みつつ呼ぶ）
  window.initReownApp = function(projectId) {
    // すでに初期化済みならスキップ（二重初期化防止）
    if (appKitInstance) {
      console.log("Reown AppKit is already initialized.");
      return;
    }

    // Viteのパーツが読み込まれているかチェック
    if (!window.ReownCore) {
      console.error("ReownCore bundle is not loaded yet. Retrying in 500ms...");
      setTimeout(() => window.initReownApp(projectId), 500);
      return;
    }

    try {
      const { createAppKit, WagmiAdapter, networks, subscribeAccount } = window.ReownCore;
      const selectedNetworks = [networks.polygon];

      // アダプターの作成
      wagmiAdapterInstance = new WagmiAdapter({
        projectId: projectId,
        networks: selectedNetworks
      });

      const metadata = {
        name: 'JPYC Sub-Payment System',
        description: "Connect Invoice into Transaction",
        url: "https://chocotanaka.github.io/Metamask_EIP-681_Pay_Web/",
        icons: ['https://raw.githubusercontent.com/ChocoTanaka/Metamask_EIP-681_Pay_Web/master/JPYCPay_512.png']
      }

      // モーダルインスタンスの作成
      appKitInstance = createAppKit({
        adapters: [wagmiAdapterInstance],
        networks: selectedNetworks,
        metadata: metadata,
        projectId: projectId,
        defaultNetwork: networks.polygon,
        networks: [networks.sepolia, networks.polygon],
        features: {
        analytics: false,
        email: false
        }
      });

      console.log("Reown AppKit initialized successfully in index.html!");
    }catch (e){
      console.error("Failed to initialize:", e);
    }
  };

  window.getWalletAddress = function() {
    if (!wagmiAdapterInstance) {
      console.warn("Adapter not ready");
      return null;
    }

    try {
      const { getAccount } = window.ReownCore;
      // 現在の接続状態（アカウント情報）をパッと取得
      const account = getCurrentAccount();

      // アドレスがあればそれを返し、なければ null を返す
      return account?.address || "NOT_INSTALLED";
    } catch (e) {
      console.error("Failed to get address:", e);
      return "NOT_INSTALLED";
    }
  }

  // ③ ウォレット接続要求（Dartから呼ばれる）
  window.connectWeb3 = async function() {
    if (!appKitInstance || !wagmiAdapterInstance) {
      console.error("AppKit not ready");
      return null;
    }
    try {
      const { getAccount } = window.ReownCore;
      const config = wagmiAdapterInstance.wagmiConfig;

      // 1. ✨【条件分岐】今すでに接続済みのアドレスがあるかチェック
      let account = getCurrentAccount();
      if (account && account.address) {
        console.log("既存のセッションを検知しました。詳細画面を開きます。");

        // すでに接続されているので、open() を呼ぶと詳細画面（残高やDisconnectボタンの画面）が開く
        appKitInstance.open();

        // 接続済みなので、待機せずに今のアドレスを即座にDartへ返す
        return account.address;
      }

      // 2. ❌ 未接続の場合のフロー
      console.log("未接続のため、新規接続モーダルを起動します。");
      appKitInstance.open(); // これでウォレット選択画面が開く

      // アドレスが確定する（ユーザーが承認する）までループ監視
      return new Promise((resolve) => {
        let attempts = 0;
        const maxAttempts = 150; // 最大30秒

        const interval = setInterval(() => {
          attempts++;
          const currentAccount = getCurrentAccount();

          // ユーザーが承認してアドレスが取れた瞬間
          if (currentAccount && currentAccount.address) {
            clearInterval(interval);

            // 新規接続時は、承認が完了したらスマートにモーダルを閉じる
            appKitInstance.close();

            resolve(currentAccount.address);
          }

          // タイムアウト、または手動で閉じられた場合
          if (attempts >= maxAttempts) {
            clearInterval(interval);
            resolve(null);
          }
        }, 200);
      });
    } catch (e) {
      console.error("Open modal error:", e);
      return null;
    }
  };

  function getCurrentAccount() {
    if (!wagmiAdapterInstance || !wagmiAdapterInstance.wagmiConfig) {
      return null;
    }

    try {
      // WagmiAdapter から config を取り出す
      const config = wagmiAdapterInstance.wagmiConfig;

      // window.ReownCore 経由で getConnection を呼び出し、config を渡す
      if (window.ReownCore && typeof window.ReownCore.getConnection === 'function') {
        const connection = window.ReownCore.getConnection(config);

        // connection の構造: { address, addresses, isConnected, chainId, ... }
        if (connection && connection.isConnected && connection.address) {
          return {
            address: connection.address,
            chainId: connection.chainId
          };
        }
      }
    } catch (err) {
      console.warn("Error getting connection from config:", err);
    }

    return null;
  }

    // 以前の sendTransaction の代わりに writeContract を用意
  window.writeContractJS = async function(contractAddress, abiJson, functionName, argsJson) {
    if (!wagmiAdapterInstance) {
      console.error("Adapter not ready");
      return null;
    }
    try {
      // 💡 window.ReownCore から writeContract を取得
      const { writeContract } = window.ReownCore;
      const config = wagmiAdapterInstance.wagmiConfig;
      const abi = JSON.parse(abiJson);
      const args = JSON.parse(argsJson); // 必要に応じてパース

      const txHash = await writeContract(config, {
        address: contractAddress,
        abi: abi,
        functionName: functionName,
        args: args,
        chainId: 137,
      });

      return txHash;
    } catch (error) {
      console.log("Contract Write Error in index.html:", error);
      return "__ERROR__:" + error.message;
      if(error.cause){
        console.log("本当の原因:", error.cause);
      }
    }
  };

  // 💡 ロードが完了したことを示すフラグを立てる
  window.isReownScriptReady = true;

  // 💡 もしすでにFlutter側がイベントリスナーを登録していれば、即時通知するイベントを発火
  window.dispatchEvent(new Event('reown_script_ready'));

  // 💡 【ここを追加！】ウォレットの接続を解除する関数
  window.disconnectWalletJS = async function() {
    if (!wagmiAdapterInstance) {
      console.warn("Adapter not ready");
      return false;
    }

    try {
      const { disconnect } = window.ReownCore;
      // disconnect を実行してセッションを切断
      await disconnect(wagmiAdapterInstance.wagmiConfig);

      console.log("Wallet disconnected successfully.");
      return true;
    } catch (e) {
      console.error("Failed to disconnect wallet:", e);
      return false;
    }
  };
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
